<!-- Quiz Question Component
     
     Usage in Quarto:
     {{< include templates/quiz-question.html >}}
     
     Then populate with your question and options.
-->

<div class="quiz-question" data-question-id="REPLACE_WITH_ID">
  <div class="question-wrapper">
    <p class="question-text">
      <!-- Question text here -->
    </p>
    
    <div class="options">
      <!-- Replace with actual options -->
      <label class="option">
        <input type="radio" name="QUESTION_ID" value="a" />
        <span class="option-label">A. Option A</span>
      </label>
      <label class="option">
        <input type="radio" name="QUESTION_ID" value="b" />
        <span class="option-label">B. Option B</span>
      </label>
      <label class="option">
        <input type="radio" name="QUESTION_ID" value="c" />
        <span class="option-label">C. Option C</span>
      </label>
      <label class="option">
        <input type="radio" name="QUESTION_ID" value="d" />
        <span class="option-label">D. Option D</span>
      </label>
    </div>
  </div>
  
  <div class="question-actions">
    <button class="btn btn-primary btn-check-answer">Check Answer</button>
    <button class="btn btn-secondary btn-skip-question" style="display: none;">Skip</button>
  </div>
  
  <details class="answer-section" open>
    <summary>Show Answer</summary>
    
    <div class="feedback" style="display: none;">
      <div class="result correct" style="display: none;">
        <strong>✓ Correct!</strong>
      </div>
      <div class="result incorrect" style="display: none;">
        <strong>✗ Not quite</strong>
      </div>
    </div>
    
    <div class="explanation">
      <!-- Explanation text here -->
      <!-- Include why the correct answer is right, and why distractors are wrong (if helpful) -->
    </div>
    
    <div class="related-page" style="margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--bs-border-color);">
      <small>
        <strong>Related:</strong> 
        <a href="#">[Learning page link]</a>
      </small>
    </div>
  </details>
</div>
