project:
  type: website
  render:
    - "*.qmd"
    - "!templates/"

website:
  title: "My notebook"
  site-url: "https://coraliewilliams.github.io/my-notebook"
  description: >
    A personal technical learning notebook covering statistics, machine learning,
    mathematics, data science, experimental design, and programming.
  search:
    location: sidebar
    type: overlay
  page-navigation: true
  sidebar:
    style: docked
    collapse-level: 2
    contents:
      - text: "Home"
        href: index.qmd
      - section: "Learn"
        href: learn/index.qmd
        contents:
          - learn/statistics/index.qmd
          - learn/machine-learning/index.qmd
          - learn/mathematics/index.qmd
          - learn/data-science/index.qmd
          - learn/experimental-design/index.qmd
          - learn/programming-computing/index.qmd
          - learn/ecology/index.qmd
      - section: "Practise"
        href: practise/index.qmd
        contents:
          - practise/worked-examples/index.qmd
          - practise/coding-exercises/index.qmd
          - practise/quizzes/index.qmd
      - section: "Track"
        href: track/index.qmd
        contents:
          - track/page-tracker/index.qmd
          - track/progress.qmd
  page-footer:
    center: "Personal technical learning notebook — built with Quarto."

format:
  html:
    theme: [cosmo, styles/custom.scss]
    toc: true
    code-copy: true
    code-overflow: wrap
    include-after-body: styles/breadcrumb-home.html

execute:
  freeze: auto
