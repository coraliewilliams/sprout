<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/>
  
  <!-- Bird body (simplified, minimalist) -->
  <ellipse cx="100" cy="110" rx="35" ry="40" fill="#1b5e20"/>
  
  <!-- Bird head -->
  <circle cx="120" cy="85" r="22" fill="#1b5e20"/>
  
  <!-- Bird eye -->
  <circle cx="128" cy="82" r="5" fill="#ffffff"/>
  <circle cx="129" cy="82" r="2.5" fill="#000000"/>
  
  <!-- Bird beak -->
  <path d="M 140 85 L 155 82 L 140 88 Z" fill="#ff6f00"/>
  
  <!-- Wings (open, flying) -->
  <path d="M 95 100 Q 50 90 45 110 Q 50 105 95 115 Z" fill="#558b2f" opacity="0.8"/>
  <path d="M 135 100 Q 180 90 185 110 Q 180 105 135 115 Z" fill="#558b2f" opacity="0.8"/>
  
  <!-- Tail feathers -->
  <path d="M 75 125 Q 60 140 65 155 Q 70 140 75 135 Z" fill="#558b2f"/>
  <path d="M 80 128 Q 68 145 75 160 Q 80 145 82 135 Z" fill="#1b5e20"/>
  
  <!-- Leaf accent (representing learning/nature) -->
  <g transform="translate(110, 55)">
    <ellipse cx="0" cy="0" rx="8" ry="12" fill="#2e7d32" transform="rotate(-45)"/>
    <path d="M -2 -8 Q 0 -5 2 -8" fill="none" stroke="#1b5e20" stroke-width="1"/>
  </g>
  
  <!-- Small learning symbol - dots suggesting progress -->
  <circle cx="50" cy="60" r="3" fill="#ff6f00" opacity="0.7"/>
  <circle cx="160" cy="60" r="3" fill="#ff6f00" opacity="0.7"/>
</svg>